name: Check imports

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "viclip_ot/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "viclip_ot/**"
  workflow_dispatch:

jobs:
  check_imports:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.9.22"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Check imports
        run: |
          export PYTHONPATH="${{ github.workspace }}"
          uv run python .github/workflows/check_imports.py --src_path viclip_ot

  lint_with_ruff:
      runs-on: ubuntu-latest
      steps:
        - name: Clone the repository
          uses: actions/checkout@v4

        - name: Install the latest version of uv and set the python version
          uses: astral-sh/setup-uv@v6
          with:
            version: ">=0.9.22"
            enable-cache: true

        - name: Lint with ruff
          run: |
            uv run ruff check --output-format=github viclip_ot

        - name: Check formatting with ruff
          run: |
            uv run ruff format --check --output-format=github viclip_ot
